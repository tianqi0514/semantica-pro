name: semantica-pro

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:${PUBLIC_PORT:-9009}:9009"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      explorer:
        condition: service_healthy
      document-extractor:
        condition: service_healthy
    networks:
      - semantica
    restart: unless-stopped

  explorer:
    build:
      context: ../..
      dockerfile: Dockerfile.cpu
      args:
        VITE_DOCUMENT_EXTRACTOR_URL: /extractor
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.org/simple}
    image: semantica-knowledge-explorer:latest
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:9009}
      SEMANTICA_ALLOW_ANONYMOUS: "true"
      SEMANTICA_PROVENANCE_DB: /data/provenance.db
    expose:
      - "8000"
    volumes:
      - explorer_data:/data
    depends_on:
      falkordb:
        condition: service_started
    networks:
      - semantica
    restart: unless-stopped

  document-extractor:
    build:
      context: ../..
      dockerfile: document_extraction_module/Dockerfile
    image: semantica-pro-document-extractor:latest
    environment:
      DOCUMENT_EXTRACT_JOB_ROOT: /data/jobs
      DOCUMENT_EXTRACT_SETTINGS_DB: /data/settings.db
      DOCUMENT_EXTRACT_SETTINGS_KEY_FILE: /data/.settings.key
      DOCUMENT_EXTRACT_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:9009}
    expose:
      - "9004"
    volumes:
      - document_extractor_data:/data
    depends_on:
      explorer:
        condition: service_healthy
    networks:
      - semantica
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:latest
    expose:
      - "6379"
    volumes:
      - falkordb_data:/data
    networks:
      - semantica
    restart: unless-stopped

networks:
  semantica:
    driver: bridge

volumes:
  explorer_data:
  document_extractor_data:
  falkordb_data:
